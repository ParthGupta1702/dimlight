<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dimlight - book movie tickets</title>
  <meta name="description" content="Browse movies, pick your seats and book tickets at dimlight.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D62828'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FFD23F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <header class="top">
    <a class="logo" href="#/" aria-label="dimlight home">dimlight</a>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" aria-label="Search movies" placeholder="Search for movies" autocomplete="off">
    </form>
    <div class="acct" id="acct"></div>
  </header>
  <div class="scallop" aria-hidden="true"></div>
  <nav class="subnav" id="subnav" aria-label="Main"></nav>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">dimlight needs JavaScript to run.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
